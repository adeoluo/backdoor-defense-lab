[project]
name = "backdoor-defense-lab"
version = "0.1.0"
description = "Backdoor attacks and defenses for image and text classifiers, measured on CIFAR-10, GTSRB and SST-2."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
# ONION scores words with a causal language model (GPT-2): uv sync --extra text
text = [
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
# Data preparation (GTSRB ships as PPM images).
data = [
    "pillow>=10.0",
]
# Reference libraries for comparison benchmarks and opt-in parity tests.
validation = [
    "adversarial-robustness-toolbox>=1.18",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backdoor_defense_lab"]

# CPU wheels for torch on Linux (CI and Docker); macOS wheels come from PyPI and include MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["backdoor_defense_lab"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
# torch leaves some methods (Tensor.backward) unannotated.
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-ra -q -m 'not validation'"
markers = ["validation: parity tests against reference libraries (uv sync --group validation)"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
